name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pip-audit
      - run: python -m pip_audit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate launcher in repository path
        shell: cmd
        run: Kuroha.bat --check
      - name: Validate launcher from Cyrillic path
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "Куроха тест"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path ".\*" -Destination $target -Recurse -Force
          & "$target\Kuroha.bat" --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "KUROHA_TEST_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate editable install from Cyrillic path
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "Куроха тест"
          py -3.13 -m venv "$target\.venv-ci"
          & "$target\.venv-ci\Scripts\python.exe" -m pip install --disable-pip-version-check -e "$target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate process command from Cyrillic path
        shell: cmd
        run: |
          chcp 65001 >nul
          pushd "%KUROHA_TEST_TARGET%"
          "%KUROHA_TEST_TARGET%\.venv-ci\Scripts\python.exe" --version
          if errorlevel 1 exit /b 1
          popd


  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e ".[dev]"
      - working-directory: web
        run: npm install
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          python -m uvicorn kuroha.app:app --host 127.0.0.1 --port 8000 > /tmp/kuroha-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/kuroha-e2e.log
          exit 1
      - working-directory: web
        run: npm run test:e2e
